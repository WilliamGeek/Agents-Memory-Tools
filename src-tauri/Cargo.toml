[package]
name = "agents-memory-tools-desktop"
version = "0.1.0"
description = "Agents Memory Tools desktop shell"
authors = ["Agents Memory Tools"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
