<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agents Memory Tools</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0b1020; color: #dbe4ff;
      font: 15px/1.6 "Segoe UI", system-ui, sans-serif;
    }
    .box { width: min(520px, calc(100vw - 48px)); padding: 32px; border: 1px solid #273354; border-radius: 18px; background: #111a30; }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 8px 0; color: #9fb0d5; }
    code { color: #8ee6c2; }
    .bar { height: 4px; margin-top: 20px; border-radius: 999px; background: #1e2a48; overflow: hidden; }
    .bar i { display: block; width: 38%; height: 100%; background: #6ea8ff; animation: move 1.4s ease-in-out infinite alternate; }
    @keyframes move { from { transform: translateX(-40%); } to { transform: translateX(180%); } }
  </style>
</head>
<body>
  <main class="box">
    <h1>正在启动本地记忆服务</h1>
    <p>桌面外壳已启动 sidecar，正在等待 <code>127.0.0.1:18923</code> 就绪。</p>
    <p>如果长时间没有反应，请检查应用数据目录中的 <code>logs</code>，并确认没有其他程序占用该端口。</p>
    <div class="bar"><i></i></div>
  </main>
  <script>
    const target = "http://127.0.0.1:18923";
    let tries = 0;
    async function poll() {
      tries += 1;
      try {
        await fetch(target + "/api/status?probe=" + Date.now(), { mode: "no-cors", cache: "no-store" });
        window.location.replace(target);
        return;
      } catch (_) {}
      if (tries > 120) {
        document.querySelector("p").textContent = "启动超时：请检查 sidecar 日志或端口占用。";
        return;
      }
      setTimeout(poll, 500);
    }
    poll();
  </script>
</body>
</html>
